name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Job de Instalación
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Dependencias
        run: pip install -r requirements.txt

  # 2. Job de Lint (Sintaxis)
  lint:
      name: Lint
      runs-on: ubuntu-latest
      needs: install
      steps:
        - name: Checkout Código
          uses: actions/checkout@v4

        - name: Configurar Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Instalar Flake8
          run: pip install flake8

        - name: Validar Sintaxis
          run: flake8 .

  # 3. Job de Formato de Código
  format:
    name: Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Black
        run: pip install black
      - name: Validar Formato
        run: black --check .

  # 4. Job de Documentación (Sphinx)
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Requerimientos
        run: pip install -r requirements.txt
      - name: Compilar Sphinx
        run: |
          cd para_sphinx/archivos/docs
          make html